plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aera.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.aera.music"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
}

chaquopy {
    defaultConfig {
        pip {
            install "flask"
            install "yt-dlp"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
